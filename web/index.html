<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Dexyd Web</title>
    <link rel="icon" href="/web/static/dexyd-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/web/static/style.css?v=20260607-errors1" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="rail">
        <header class="brand">
          <img src="/web/static/dexyd-icon.svg" alt="" />
          <div>
            <strong>dexyd</strong>
            <span id="bridgeStatus">starting</span>
          </div>
        </header>

        <nav class="tabs" aria-label="Dexyd sections">
          <button class="tab active" data-page="sessionsPage" type="button">Sessions</button>
          <button class="tab" data-page="inboxPage" type="button">Inbox <span id="inboxBadge" class="badge" hidden>0</span></button>
          <button id="openSettings" class="tab" type="button">Settings</button>
        </nav>

        <section class="project-panel">
          <label for="projectPath">Project</label>
          <div class="project-row">
            <input id="projectPath" autocomplete="off" spellcheck="false" placeholder="~/Projects/dexyd" />
            <button id="upProject" class="square" title="Go up one folder" type="button">↑</button>
            <button id="loadProject" class="square" title="Load project" type="button">↻</button>
          </div>
          <div id="suggestions" class="suggestions" hidden></div>
          <button id="newSession" class="primary full" type="button">New session</button>
        </section>

        <section id="sessionsPage" class="panel-page active">
          <div class="panel-title">
            <div>
              <h2>Sessions</h2>
              <p>Current project</p>
            </div>
            <button id="refreshSessions" class="square" title="Refresh sessions" type="button">↻</button>
          </div>
          <div id="sessions" class="list"></div>
        </section>

        <section id="inboxPage" class="panel-page">
          <div class="panel-title">
            <div>
              <h2>Inbox</h2>
              <p>Questions and updates</p>
            </div>
            <button id="clearInbox" class="ghost small" type="button">Clear</button>
          </div>
          <div id="systemSummary" class="summary"></div>
          <div id="inboxList" class="list"></div>
        </section>
      </aside>

      <main class="workspace">
        <section id="emptyState" class="welcome">
          <div class="welcome-box">
            <div class="welcome-icon">⌁</div>
            <h1>Ready</h1>
            <p>Select a session or create one for the selected project.</p>
            <span>Self-hosted Dexyd control surface</span>
          </div>
        </section>

        <section id="chatView" class="chat" hidden>
          <header class="chat-header">
            <div class="chat-title">
              <h1 id="chatTitle">Session</h1>
              <p id="chatMeta"></p>
            </div>
            <div class="chat-actions">
              <span id="usagePill" class="pill">usage unknown</span>
              <button id="deleteSession" class="ghost danger" type="button">Hide</button>
              <button id="cancelTurn" class="ghost" type="button">Cancel</button>
              <button id="refreshChat" class="ghost" type="button">Refresh</button>
            </div>
          </header>

          <div id="queueBox" class="queue" hidden></div>
          <div id="commandBar" class="command-bar" hidden></div>
          <div id="messages" class="messages"></div>

          <form id="composer" class="composer">
            <button id="commandButton" type="button" class="ghost command-button" title="Commands">/</button>
            <textarea id="messageInput" rows="1" placeholder="Message Codex…"></textarea>
            <button id="sendButton" class="primary send" type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>

    <dialog id="settingsDialog" class="modal settings-modal">
      <header class="modal-head">
        <div>
          <strong>Settings</strong>
          <span>Connection, account, and session controls</span>
        </div>
        <button id="closeSettings" class="ghost" type="button">Close</button>
      </header>
      <div class="settings-layout">
        <nav id="settingsMenu" class="settings-menu" aria-label="Settings sections"></nav>
        <section id="settingsBody" class="settings-body"></section>
      </div>
    </dialog>

    <dialog id="diffDialog" class="modal diff-dialog">
      <header class="modal-head">
        <strong>Code diff</strong>
        <button id="closeDiff" class="ghost" type="button">Close</button>
      </header>
      <pre id="diffText"></pre>
    </dialog>

    <dialog id="answerDialog" class="modal answer-dialog">
      <form method="dialog">
        <h2 id="answerTitle">Respond</h2>
        <p id="answerPrompt" class="muted"></p>
        <div id="answerOptions" class="answer-options"></div>
        <textarea id="answerText" rows="4" placeholder="Type response…"></textarea>
        <footer>
          <button value="cancel" class="ghost">Cancel</button>
          <button id="submitAnswer" value="default" class="primary">Send</button>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/web/static/app.js?v=20260607-errors1" type="module"></script>
  </body>
</html>
