services:
  dexyd-web:
    build: .
    image: dexyd-web:local
    container_name: dexyd-web
    restart: unless-stopped
    ports:
      - "${DEXYD_WEB_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEB_PORT: 8080
      BRIDGE_URL: ${DEXYD_BRIDGE_URL:-http://host.docker.internal:4242}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
