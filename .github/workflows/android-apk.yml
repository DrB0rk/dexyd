name: Android APK

on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install bridge dependencies
        run: npm ci

      - name: Check bridge
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install mobile dependencies
        working-directory: mobile/dexydMobile
        run: npm ci

      - name: Check mobile
        working-directory: mobile/dexydMobile
        run: |
          npx tsc --noEmit
          npm run lint
          npm test -- --runInBand

      - name: Build APK
        working-directory: mobile/dexydMobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dexyd-debug-apk-${{ github.ref_name }}-${{ github.sha }}
          path: mobile/dexydMobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
