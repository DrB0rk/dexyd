name: Android Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install bridge dependencies
        run: npm ci

      - name: Check bridge
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install mobile dependencies
        working-directory: mobile/dexydMobile
        run: npm ci

      - name: Check mobile
        working-directory: mobile/dexydMobile
        run: |
          npx tsc --noEmit
          npm run lint
          npm test -- --runInBand

      - name: Build release APK
        working-directory: mobile/dexydMobile/android
        run: ./gradlew assembleRelease

      - name: Prepare APK asset
        run: |
          mkdir -p release-assets
          cp mobile/dexydMobile/android/app/build/outputs/apk/release/app-release.apk "release-assets/dexyd-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "release-assets/dexyd-${GITHUB_REF_NAME}.apk" --clobber
